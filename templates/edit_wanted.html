<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Wanted 管理 · Stripchat 录制</title>
  <script>try{var t=localStorage.getItem('jp-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="{{.base_path}}/static/jp-ui.css">
  <link rel="stylesheet" href="{{.base_path}}/static/sc.css">
</head>
<body class="jp" data-base-path="{{.base_path}}" data-csrf-token="{{.csrf_token}}">
  <header class="jp-top">
    <a class="jp-home" href="{{.base_path}}/" title="返回录制面板">← 录制面板</a>
    <div class="jp-brand">Wanted 管理</div>
    <span class="jp-spacer"></span>
    <button class="jp-btn icon sm ghost" id="theme" type="button"></button>
  </header>

  <main class="jp-main narrow">
    <div class="jp-banner" id="banner" role="alert" hidden></div>

    <section class="jp-card">
      <div class="jp-card-head"><h2>添加主播</h2></div>
      <div class="jp-card-body">
        <form class="wanted-add" id="add-form">
          <textarea class="jp-input" id="models-input" aria-label="主播名" placeholder="每行一个主播名或主页地址，也可以用逗号分隔" maxlength="6500" required></textarea>
          <div class="jp-toolbar"><span class="jp-muted" id="add-preview"></span><span class="jp-spacer"></span><button class="jp-btn primary" type="submit">添加</button></div>
        </form>
      </div>
    </section>

    <section class="jp-card">
      <div class="jp-card-head">
        <h2>当前列表</h2><span class="jp-count" id="count"></span>
      </div>
      <div class="jp-card-body">
        <div class="jp-banner" id="duplicate" data-tone="warn" hidden></div>
        <div class="jp-toolbar"><input class="jp-input" type="search" id="search" placeholder="搜索" autocomplete="off"></div>
        <div class="jp-chips wanted-list" id="models"></div>
        <div class="jp-empty" id="empty" hidden></div>
      </div>
    </section>
  </main>

  <script src="{{.base_path}}/static/jp-ui.js"></script>
  <script src="{{.base_path}}/static/wanted.js"></script>
</body>
</html>
