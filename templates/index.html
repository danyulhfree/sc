<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Stripchat 录制</title>
  <script>try{var t=localStorage.getItem('jp-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="{{.base_path}}/static/jp-ui.css">
  <link rel="stylesheet" href="{{.base_path}}/static/sc.css">
</head>
<body class="jp" data-base-path="{{.base_path}}" data-csrf-token="{{.csrf_token}}">
  <header class="jp-top">
    <a class="jp-home" href="/" title="返回服务入口">← 入口</a>
    <div class="jp-brand">Stripchat 录制</div>
    <span class="jp-spacer"></span>
    <span class="jp-conn" id="conn" data-state="loading">连接中…</span>
    <button class="jp-btn icon sm ghost" id="theme" type="button"></button>
  </header>

  <main class="jp-main">
    <div class="jp-banner" id="banner" role="alert" hidden></div>

    <section class="jp-stats" aria-label="概况">
      <div class="jp-stat" data-tone="live"><span class="jp-stat-label">正在录制</span><span class="jp-stat-value" id="stat-recording">—</span><span class="jp-stat-hint" id="stat-checking">—</span></div>
      <div class="jp-stat" id="stat-wanted-card"><span class="jp-stat-label">Wanted</span><span class="jp-stat-value" id="stat-wanted">—</span><span class="jp-stat-hint" id="stat-wanted-hint">—</span></div>
      <div class="jp-stat" id="stat-queue-card"><span class="jp-stat-label">上传队列</span><span class="jp-stat-value" id="stat-queue">—</span><span class="jp-stat-hint" id="stat-queue-hint">—</span></div>
      <div class="jp-stat" id="stat-disk-card"><span class="jp-stat-label">磁盘可用</span><span class="jp-stat-value" id="stat-disk">—</span><span class="jp-stat-hint" id="stat-disk-hint">—</span></div>
      <div class="jp-stat"><span class="jp-stat-label">服务运行</span><span class="jp-stat-value" id="stat-uptime">—</span><span class="jp-stat-hint" id="stat-version">—</span></div>
    </section>

    <section class="jp-card">
      <div class="jp-card-head"><h2>正在录制</h2><span class="jp-count" id="recording-count"></span></div>
      <div class="jp-card-body flush">
        <table class="jp-table" id="recording-table" hidden>
          <thead><tr><th>主播</th><th>文件</th><th>大小</th><th>时长</th><th></th></tr></thead>
          <tbody id="recording-body"></tbody>
        </table>
        <div class="jp-empty" id="recording-empty"><strong>暂无录制任务</strong>Wanted 中的主播开播后会自动开始录制</div>
      </div>
    </section>

    <section class="jp-card">
      <div class="jp-card-head">
        <h2>主播状态</h2><span class="jp-count" id="model-count"></span>
        <span class="jp-spacer"></span>
        <a class="jp-btn sm" href="{{.base_path}}/wanted">管理 Wanted</a>
      </div>
      <div class="jp-card-body">
        <div class="jp-toolbar model-tools">
          <input class="jp-input" type="search" id="model-search" placeholder="搜索主播" autocomplete="off">
          <div class="jp-seg" id="model-filter" role="group" aria-label="状态筛选">
            <button type="button" data-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-filter="active">在线</button>
            <button type="button" data-filter="problem">异常</button>
            <button type="button" data-filter="paused">已暂停</button>
            <button type="button" data-filter="idle">离线</button>
          </div>
        </div>
        <div class="sc-models" id="models"></div>
        <div class="jp-empty" id="models-empty" hidden></div>
      </div>
    </section>

    <div class="jp-split">
      <section class="jp-card">
        <div class="jp-card-head"><h2>上传</h2><span class="jp-spacer"></span><span class="jp-badge" id="upload-state">—</span></div>
        <div class="jp-card-body">
          <dl class="jp-kv">
            <dt>队列</dt><dd id="upload-queue">—</dd>
            <dt>最近成功</dt><dd id="upload-success">—</dd>
            <dt>最近错误</dt><dd id="upload-error">—</dd>
            <dt>状态更新</dt><dd id="upload-updated">—</dd>
          </dl>
        </div>
      </section>
      <section class="jp-card">
        <div class="jp-card-head"><h2>磁盘</h2><span class="jp-count" id="disk-percent"></span></div>
        <div class="jp-card-body">
          <dl class="jp-kv">
            <dt>总容量</dt><dd id="disk-total">—</dd>
            <dt>已使用</dt><dd id="disk-used">—</dd>
            <dt>可用</dt><dd id="disk-free">—</dd>
          </dl>
          <div class="jp-meter disk-meter" id="disk-meter"><span></span></div>
        </div>
      </section>
    </div>

    <section class="jp-card">
      <div class="jp-card-head"><h2>设置</h2></div>
      <div class="jp-card-body">
        <form class="jp-toolbar" id="settings-form">
          <label for="segment-minutes">分段时长</label>
          <input class="jp-input settings-minutes" id="segment-minutes" type="number" min="1" max="1440" value="{{.segment_minutes}}" required>
          <span class="jp-muted">分钟</span>
          <button class="jp-btn primary" type="submit">保存</button>
          <span class="jp-muted settings-hint">新录制从下一段开始按新时长切分</span>
        </form>
      </div>
    </section>
  </main>

  <script src="{{.base_path}}/static/jp-ui.js"></script>
  <script src="{{.base_path}}/static/sc.js"></script>
</body>
</html>
